name: Build Production

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: jot_flutter

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  native:
    name: ${{ matrix.platform }} release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: android, os: ubuntu-24.04}
          - {platform: ios, os: macos-15}
          - {platform: macos, os: macos-15}
          - {platform: windows, os: windows-2022}
          - {platform: linux, os: ubuntu-24.04}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache pinned Flutter SDK
        id: flutter-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/jot-flutter
          key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-v1
      - name: Install pinned Flutter
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/jot-flutter"
      - name: Configure Flutter
        run: |
          echo "$RUNNER_TEMP/jot-flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/jot-flutter/bin/flutter" --version
      - name: Install Android Java toolchain
        if: matrix.platform == 'android'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Linux desktop toolchain
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze Flutter source
        run: flutter analyze
      - name: Verify native transport, beginner guidance and shared gestures
        run: flutter test test/core_transport_test.dart test/platform_drag_test.dart test/beginner_guidance_test.dart test/board_rendering_regression_test.dart test/board_cache_interaction_test.dart

      - name: Configure optional Android release key
        if: matrix.platform == 'android' && github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          names = ('ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD',
                   'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD')
          values = [os.environ.get(name, '') for name in names]
          if not any(values):
              print('Building unsigned Android Release artifacts; no release key configured.')
          elif not all(values):
              raise SystemExit('Set all four ANDROID_* signing secrets, or leave all unset.')
          else:
              key = Path(os.environ['RUNNER_TEMP']) / 'jot-release-keystore.jks'
              key.write_bytes(base64.b64decode(values[0], validate=True))
              key.chmod(0o600)
              def property_value(value):
                  return ''.join('\\u%04x' % unit for unit in
                                 (int.from_bytes(value.encode('utf-16-be')[i:i+2], 'big')
                                  for i in range(0, len(value.encode('utf-16-be')), 2)))
              properties = {'storeFile': str(key.resolve()), 'storePassword': values[1],
                            'keyAlias': values[2], 'keyPassword': values[3]}
              signing = Path('android/key.properties')
              signing.write_text(''.join(k + '=' + property_value(v) + '\n'
                                        for k, v in properties.items()), encoding='ascii')
              signing.chmod(0o600)
              print('Configured Android Release signing.')
          PY

      - name: Build native Release
        env:
          JOT_PLATFORM: ${{ matrix.platform }}
        run: |
          case "$JOT_PLATFORM" in
            android)
              flutter build appbundle --release --build-number "$GITHUB_RUN_NUMBER"
              flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"
              ;;
            ios)
              flutter build ipa --release --no-codesign --build-number "$GITHUB_RUN_NUMBER"
              ;;
            macos|windows|linux)
              flutter build "$JOT_PLATFORM" --release --build-number "$GITHUB_RUN_NUMBER"
              ;;
            *) exit 1 ;;
          esac

      - name: Package Android and Apple releases
        if: matrix.platform == 'android' || matrix.platform == 'ios' || matrix.platform == 'macos'
        env:
          JOT_PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p build/artifacts
          case "$JOT_PLATFORM" in
            android)
              jot_signing=unsigned
              if [[ -f android/key.properties ]]; then jot_signing=signed; fi
              cp build/app/outputs/flutter-apk/app-release.apk "build/artifacts/jot-android-release-$jot_signing.apk"
              cp build/app/outputs/bundle/release/app-release.aab "build/artifacts/jot-android-release-$jot_signing.aab"
              printf 'Android Release signing: %s\n' "$jot_signing" >> "$GITHUB_STEP_SUMMARY"
              ;;
            ios)
              test -s build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/Frameworks/jot_core.framework/jot_core
              ditto -c -k --sequesterRsrc --keepParent build/ios/archive/Runner.xcarchive build/artifacts/jot-ios-release-unsigned.xcarchive.zip
              echo 'iOS: unsigned device archive; signing and IPA export remain required for distribution.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            macos)
              test -s build/macos/Build/Products/Release/Jot.app/Contents/Frameworks/jot_core.framework/jot_core
              ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/Jot.app build/artifacts/jot-macos-universal-release.zip
              echo 'macOS: universal Release app; Developer ID signing and notarization are not performed.' >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

      - name: Package Linux bundle with executable permissions
        if: matrix.platform == 'linux'
        run: |
          test -x build/linux/x64/release/bundle/jot_flutter
          test -s build/linux/x64/release/bundle/lib/libjot_core.so
          mkdir -p build/artifacts
          tar -czf build/artifacts/jot-linux-x64-release.tar.gz -C build/linux/x64/release bundle

      - name: Bundle Windows VC runtime and complete Release directory
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $jotBundle = 'build/windows/x64/runner/Release'
          if (!(Test-Path "$jotBundle/jot_flutter.exe")) { throw 'Windows executable missing.' }
          if (!(Test-Path "$jotBundle/jot_core.dll")) { throw 'Native C++ library missing.' }
          $jotVsWhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $jotVsRoot = & $jotVsWhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$jotVsRoot) { throw 'Visual C++ installation missing.' }
          $jotRedistVersions = Get-ChildItem "$jotVsRoot/VC/Redist/MSVC" -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Name } -Descending
          $jotCrt = $jotRedistVersions | ForEach-Object {
            $jotX64 = Join-Path $_.FullName 'x64'
            if (Test-Path $jotX64 -PathType Container) {
              Get-ChildItem $jotX64 -Directory -Filter 'Microsoft.VC*.CRT'
            }
          } | Select-Object -First 1
          if (!$jotCrt) { throw 'Visual C++ runtime redistributables missing.' }
          Copy-Item "$($jotCrt.FullName)/*.dll" -Destination $jotBundle -Force
          foreach ($jotDll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            if (!(Test-Path "$jotBundle/$jotDll")) { throw "Runtime missing: $jotDll" }
          }
          New-Item -ItemType Directory -Force 'build/artifacts' | Out-Null
          Compress-Archive -Path "$jotBundle/*" -DestinationPath 'build/artifacts/jot-windows-x64-release.zip'

      - name: Record build identity and SHA256 checksums
        env:
          JOT_PLATFORM: ${{ matrix.platform }}
        run: |
          printf 'Platform: %s\nCommit: %s\nRef: %s\nBuild number: %s\nFlutter: %s\n' \
            "$JOT_PLATFORM" "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_NUMBER" "$FLUTTER_VERSION" \
            > build/artifacts/BUILD.txt
          cd build/artifacts
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum jot-* > SHA256SUMS
            sha256sum --check SHA256SUMS
          else
            shasum -a 256 jot-* > SHA256SUMS
            shasum -a 256 --check SHA256SUMS
          fi

      - name: Upload native Release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jot-${{ matrix.platform }}-release
          path: jot_flutter/build/artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Remove temporary Android signing files
        if: always() && matrix.platform == 'android'
        run: |
          rm -f android/key.properties "$RUNNER_TEMP/jot-release-keystore.jks"
