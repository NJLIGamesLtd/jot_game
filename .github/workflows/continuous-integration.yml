name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: jot_flutter

env:
  FLUTTER_VERSION: '3.41.9'
  EMSDK_VERSION: '4.0.13'

jobs:
  tests:
    name: Unit, regression, integration, UI and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: /usr/bin/clang-18
      CXX: /usr/bin/clang++-18
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install matching Clang and LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
      - name: Cache pinned Flutter SDK
        id: flutter-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/jot-flutter
          key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}-v1
      - name: Install pinned Flutter
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/jot-flutter"
      - name: Configure Flutter
        run: |
          echo "$RUNNER_TEMP/jot-flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/jot-flutter/bin/flutter" --version
      - name: Cache Dart dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('jot_flutter/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-
      - name: Cache pinned Emscripten SDK
        id: emsdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/jot-emsdk
          key: emsdk-${{ runner.os }}-${{ runner.arch }}-${{ env.EMSDK_VERSION }}-v1
      - name: Install pinned Emscripten
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/jot-emsdk"
          "$RUNNER_TEMP/jot-emsdk/emsdk" install "$EMSDK_VERSION"
      - name: Configure Emscripten
        run: |
          "$RUNNER_TEMP/jot-emsdk/emsdk" activate "$EMSDK_VERSION"
          source "$RUNNER_TEMP/jot-emsdk/emsdk_env.sh" > /dev/null
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          echo "EM_CONFIG=${EM_CONFIG:-$RUNNER_TEMP/jot-emsdk/.emscripten}" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/jot-emsdk/upstream/emscripten" >> "$GITHUB_PATH"
      - name: Configure Node and npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            jot_flutter/tools/package-lock.json
            jot_flutter/multiplayer/package-lock.json
      - name: Configure bundled Google Chrome
        run: |
          jot_chrome="${CHROME_EXECUTABLE:-}"
          if [[ ! -x "$jot_chrome" ]]; then
            jot_chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          fi
          if [[ ! -x "$jot_chrome" ]]; then
            echo "::error::The browser UI tests require Google Chrome on this runner." >&2
            exit 1
          fi
          echo "CHROME_EXECUTABLE=$jot_chrome" >> "$GITHUB_ENV"
          "$jot_chrome" --version
      - name: Run complete test and coverage pipeline
        run: |
          test -f test/platform_drag_test.dart
          python3 tools/run_tests.py
      - name: Publish coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jot-runtime-coverage
          path: |
            jot_flutter/coverage/summary.*
            jot_flutter/coverage/lcov.info
            jot_flutter/coverage/browser
            jot_flutter/coverage/dart-web
            jot_flutter/coverage/multiplayer
            jot_flutter/coverage/cpp/html
            jot_flutter/coverage/cpp/summary.json
            jot_flutter/coverage/cpp/lcov.info
          if-no-files-found: error
          retention-days: 14

  cpp:
    name: C++ Release tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure Release core
        run: cmake -S packages/jot_core -B build/core -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build Release core and tests
        run: cmake --build build/core --config Release --parallel
      - name: Run Release CTests
        run: ctest --test-dir build/core -C Release --output-on-failure
      - name: Configure ASan and UBSan core
        if: runner.os == 'Linux'
        env:
          CC: /usr/bin/clang-18
          CXX: /usr/bin/clang++-18
        run: |
          cmake -S packages/jot_core -B build/core-sanitize \
            -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build ASan and UBSan core and tests
        if: runner.os == 'Linux'
        run: cmake --build build/core-sanitize --parallel
      - name: Run ASan and UBSan CTests
        if: runner.os == 'Linux'
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/core-sanitize --output-on-failure
