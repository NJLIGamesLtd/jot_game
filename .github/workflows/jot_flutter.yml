name: Jot rewrite
on: [push, pull_request]
defaults:
  run:
    shell: bash
    working-directory: jot_flutter
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install coverage toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
          git clone --depth 1 --branch 3.41.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.13
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.13
          echo "$RUNNER_TEMP/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            jot_flutter/tools/package-lock.json
            jot_flutter/multiplayer/package-lock.json
      - name: Unit, regression, integration, UI and complete coverage gates
        run: python3 tools/run_tests.py
      - name: Publish coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jot-runtime-coverage
          path: |
            jot_flutter/coverage/summary.*
            jot_flutter/coverage/lcov.info
            jot_flutter/coverage/browser
            jot_flutter/coverage/dart-web
            jot_flutter/coverage/multiplayer
            jot_flutter/coverage/cpp/html
            jot_flutter/coverage/cpp/summary.json
            jot_flutter/coverage/cpp/lcov.info
          if-no-files-found: error
  cpp:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S packages/jot_core -B build/core -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/core --config Release --parallel
      - run: ctest --test-dir build/core -C Release --output-on-failure
  flutter:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: web}
          - {os: ubuntu-latest, target: apk}
          - {os: ubuntu-latest, target: linux}
          - {os: windows-latest, target: windows}
          - {os: macos-latest, target: macos}
          - {os: macos-latest, target: ios}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.41.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Linux desktop dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Install Emscripten
        if: matrix.target == 'web'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.13
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.13
          echo "$RUNNER_TEMP/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        if: matrix.target == 'web'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: jot_flutter/multiplayer/package-lock.json
      - run: flutter pub get
      - run: flutter analyze
      - name: Unit, regression, integration and platform drag tests
        run: |
          test -f test/platform_drag_test.dart
          flutter test
      - name: Configure bundled Google Chrome
        if: matrix.target == 'web'
        run: |
          jot_chrome="${CHROME_EXECUTABLE:-}"
          if [[ ! -x "$jot_chrome" ]]; then
            jot_chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          fi
          if [[ ! -x "$jot_chrome" ]]; then
            echo "::error::The web drag regression requires Google Chrome on this runner." >&2
            exit 1
          fi
          echo "CHROME_EXECUTABLE=$jot_chrome" >> "$GITHUB_ENV"
          "$jot_chrome" --version
      - name: Platform drag regression in Chrome
        if: matrix.target == 'web'
        timeout-minutes: 10
        run: flutter test --platform chrome test/platform_drag_test.dart
      - name: Build browser engine
        if: matrix.target == 'web'
        run: python3 tools/build_web_core.py && node tools/test_web_core.cjs && node tools/test_web_bridge.cjs
      - name: Verify multiplayer authority
        if: matrix.target == 'web'
        run: |
          python3 tools/build_server_core.py
          node --test packages/jot_core/tests/server_wasm_tests.mjs
          npm --prefix multiplayer ci
          npm --prefix multiplayer run check
          npm --prefix multiplayer test
      - name: Build iOS without signing
        if: matrix.target == 'ios'
        run: flutter build ios --release --no-codesign
      - name: Build target
        if: matrix.target != 'ios'
        run: flutter build ${{ matrix.target }} --release
