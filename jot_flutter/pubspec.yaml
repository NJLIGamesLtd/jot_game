name: jot_flutter
description: Jot word game with a shared C++ engine and Flutter interface.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  jot_core:
    path: packages/jot_core
  shared_preferences: ^2.5.3
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  ffi: ^2.1.4
flutter:
  uses-material-design: true
  assets:
    - assets/dictionary/words.txt
